[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[project.urls]
Homepage = "https://github.com/LiuGaoyong/RxNetGen"
Repository = "https://github.com/LiuGaoyong/RxNetGen"
Issues = "https://github.com/LiuGaoyong/RxNetGen/issues/"
[project.scripts]
rxnetgen-config = "rxnetgen.config:print_config"
rxnetgen-network = "rxnetgen.network:main"
rxnetgen-run = "rxnetgen.runner:run"
[project]
name = "rxnetgen"
version = "0.0.1"
readme = "README.md"
description = "The Reaction Network for KMC Simulation."
authors = [{ name = "LiuGaoyong", email = "liugaoyong_88@163.com" }]
license-files = ["src/LICENSE"]
license = "GPL-3.0-or-later"
requires-python = ">=3.12"
keywords = [
    "chemistry",    #
    "graph theory",
    "reaction",
    "event",
    "KMC",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "ase>=3.0",
    "arrayff>=0.0",
    "graphatoms>=3.0",
    "hydra-core",
    "loguru",
    "omegaconf",
    "ray[default]>=2.52",
    "sqlalchemy",
    "sqlmodel",
    "typer",
    "typing-extensions",
]
[dependency-groups]
dev = [
    "ruff>=0.11",
    "pytest>=8.3",
    "pytest-xdist",
    "jupyterlab",
    "chemiscope",
    "nglview",
    "grpcio",
]

# uv config
[tool.uv]
package = true
[[tool.uv.index]]
# url = "https://mirrors.cernet.edu.cn/pypi/web/simple" # CERNET
url = "https://mirrors.nju.edu.cn/pypi/web/simple" # NJU
default = true
# [[tool.uv.index]]
# name = "pytorch-cpu"
# url = "https://mirrors.nju.edu.cn/pytorch/whl/cpu/"
# explicit = true
# format = "flat"
# [tool.uv.sources]
# torch = [{ index = "pytorch-cpu" }]

# pytest config
[tool.pytest.ini_options]
filterwarnings = [
    "error", # All other warnings are transformed into errors.
    # ignore the following warnings that matching a regex
    # example: "ignore:function ham\(\) is deprecated:DeprecationWarning",
    "ignore::RuntimeWarning",
    "ignore::DeprecationWarning",
    "ignore::pytest.PytestAssertRewriteWarning",
    "ignore:unclosed file.*:ResourceWarning",

]
addopts = "--maxfail=1 -rf" # exit after 1 failures, report fail info
testpaths = ["src/tests"]

# ruff config
[tool.ruff]
line-length = 80
indent-width = 4
unsafe-fixes = true
[tool.ruff.lint]
select = ["F", "E", "W", "UP", "TID"]
ignore = ["F722", "D100"]
[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pixi.package]

[tool.pixi.package.build]
backend = { name = "pixi-build-python", version = "*" }

[tool.pixi.workspace]
preview = ["pixi-build"]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "win-64"]

[tool.pixi.pypi-dependencies]
rxnetgen = { path = ".", editable = true }

[tool.pixi.environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }

[tool.pixi.tasks]
test = "pytest -s -vv"

[tool.pixi.dependencies]
python = ">=3.12"
ase = ">=3.0"
arrayff = ">=0.0"
graphatoms = ">=3.0"
hydra-core = ">=1.3.0"
loguru = ">=0.7.3"
omegaconf = ">=2.3.1"
ray-default = ">=2.52"
sqlalchemy = ">=1"
sqlmodel = ">=0"
typer = ">=0.20"
typing-extensions = ">=4.12"
ruff = ">=0.11"
pytest = ">=8.3"
pytest-xdist = ">=3.8.0"
jupyterlab = ">=4.5.8"
chemiscope = ">=0.1.0"
nglview = ">=0.14.0"
grpcio = ">=1.52.0"
